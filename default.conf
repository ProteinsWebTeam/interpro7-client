server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Redirects are issued behind an ingress terminating on 80/443. Letting
    # nginx build them from its own listen port sends clients to a dead :8080.
    absolute_redirect off;

    # The build emits .gz siblings next to every js/css/html/svg asset.
    gzip_static on;

    location = / {
        return 302 /interpro/;
    }

    # The commonly shared form of the URL has no trailing slash.
    location = /interpro {
        return 301 /interpro/;
    }

    # index.html names content-hashed bundles, so it must never be cached.
    location = /interpro/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-cache";
    }

    # Content-hashed build output. A miss here is a chunk from an older deploy:
    # answer 404 so the client fails loudly, rather than handing it index.html
    # under a JavaScript content type and leaving it on the loading screen.
    location ~ ^/interpro/((?:js|css|assets)/.+)$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Everything else is a client-side route: hand it the app shell.
    location /interpro/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /interpro/index.html;
    }
}
